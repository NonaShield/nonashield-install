# =============================================================================
# NonaShield — Minimal Production Stack (4 services) — Ubuntu / Linux
#
# Copy of payshield-backend/docker-compose.minimal.yml (untouched, proven,
# committed separately) — nothing below differs by host OS. Deliberately
# leaner than docker-compose.full.ubuntu.yml at the APPLICATION level, not
# just the compose level: ENABLE_KAFKA_AUDIT=false below means the backend
# itself never tries to reach Redpanda, so no redpanda/processor/ingestion
# container is needed at all here.
#
# Scope: device/SDK -> nginx (edge trust verification + RASP/behavior/geo
# ingestion) -> backend (enrollment, threat ingestion, SOC dashboard) ->
# postgres (storage) + redis (pubkey cache, replay/nonce store).
#
# Deliberately excludes: neo4j (graph/fraud-ring analysis), redpanda (Kafka
# audit streaming), minio (evidence object storage), vault (secrets --
# USE_VAULT is already false in app code), grafana/prometheus (metrics),
# airflow (job scheduling), mqtt, ollama (analyst-only LLM features).
# None of those are required for threat ingestion or the SOC dashboard.
#
# Same native Docker Engine + Compose plugin that install/install-ubuntu.sh
# installs — no Docker Desktop / WSL2 involved.
#
# Quick start (run from install/, .env lives in payshield-backend/):
#   cp ../payshield-backend/.env.example ../payshield-backend/.env   # fill in secrets
#   docker compose -f docker-compose.minimal.ubuntu.yml --env-file ../payshield-backend/.env up -d --build
#   docker compose -f docker-compose.minimal.ubuntu.yml --env-file ../payshield-backend/.env down        # keep data
#   docker compose -f docker-compose.minimal.ubuntu.yml --env-file ../payshield-backend/.env down -v     # wipe data
#
# This file additionally requires (not needed by the full stack, since it
# defaults them there): JWT_PRIVATE_KEY_PEM, JWT_PUBLIC_KEY_PEM, CSRF_SECRET,
# EDGE_INTERNAL_SECRET. Generate RSA keys with:
#   openssl genrsa -out jwt_private.pem 2048 && openssl rsa -in jwt_private.pem -pubout -out jwt_public.pem
# and CSRF_SECRET/EDGE_INTERNAL_SECRET with: openssl rand -hex 32
# =============================================================================

networks:
  payshield-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  models_data:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    image: nonashield/nginx-edge:latest
    container_name: payshield-nginx
    environment:
      PAYSHIELD_SERVER_NAME: "${PAYSHIELD_SERVER_NAME:-api.diimeai.com}"
      EDGE_CONTEXT_HMAC_KEY: "${EDGE_CONTEXT_HMAC_KEY:?EDGE_CONTEXT_HMAC_KEY must be set (openssl rand -hex 32)}"
      REDIS_HOST:            redis
      REDIS_PORT:            "6379"
      REDIS_PASSWORD:        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      ALLOWED_ORIGINS:       "${CORS_ALLOWED_ORIGINS:-https://diimeai.com,https://api.diimeai.com}"
      POLICY_SYNC_INTERVAL:  "60"
      ATTESTATION_BYPASS_ALLOWED: "${ATTESTATION_BYPASS_ALLOWED:-false}"
    ports:
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - type: bind
        source: "${SSL_DIR:?SSL_DIR must be set (dir containing fullchain.pem + privkey.pem)}"
        target: /etc/nginx/ssl
        read_only: true
      - type: bind
        source: "${GEOIP_DIR:?GEOIP_DIR must be set (dir containing GeoLite2-*.mmdb files)}"
        target: /usr/share/GeoIP
        read_only: true
      - type: bind
        source: ../payshield-backend/config/threat_matrix.json
        target: /etc/nginx/config/threat_matrix.json
        read_only: true
      - type: bind
        source: ../nginx/lua
        target: /etc/nginx/lua
        read_only: true
      - type: bind
        source: ../nginx/nginx.conf
        target: /etc/nginx/nginx.conf.template
        read_only: true
      - nginx_logs:/var/log/nginx
    networks: [payshield-net]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -k https://localhost:8443/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  postgres:
    image: postgres:15-alpine
    container_name: payshield-postgres
    environment:
      POSTGRES_DB:       payshield
      POSTGRES_USER:     payshield
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../payshield-backend/infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks: [payshield-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payshield -d payshield"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: payshield-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD:-}"
      - --protected-mode
      - "yes"
      - --tcp-keepalive
      - "60"
    volumes:
      - redis_data:/data
    networks: [payshield-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  backend:
    build:
      context: ../payshield-backend
      dockerfile: Dockerfile
      target: production
    image: nonashield/backend:latest
    container_name: payshield-backend
    environment:
      ENVIRONMENT:     "${ENVIRONMENT:-production}"
      APP_ENV:         "${APP_ENV:-production}"
      LOG_LEVEL:       "${LOG_LEVEL:-info}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-4}"
      UVICORN_HOST:    "0.0.0.0"
      UVICORN_PORT:    "8000"

      # API security
      API_SECRET_KEY:                   "${API_SECRET_KEY:?API_SECRET_KEY must be set}"
      JWT_SECRET:                       "${JWT_SECRET:?JWT_SECRET must be set}"
      BACKEND_API_KEY:                  "${BACKEND_API_KEY:?BACKEND_API_KEY must be set}"
      PAYSHIELD_SIGNING_SECRET_DEFAULT: "${PAYSHIELD_SIGNING_SECRET_DEFAULT:?PAYSHIELD_SIGNING_SECRET_DEFAULT must be set}"
      POLICY_SIGNING_SECRET:            "${PAYSHIELD_SIGNING_SECRET_DEFAULT:?PAYSHIELD_SIGNING_SECRET_DEFAULT must be set}"

      # JWT RSA key pair — required in production (checked at import time by
      # jwt_validator.py and again in main.py's startup handler).
      JWT_PRIVATE_KEY_PEM: "${JWT_PRIVATE_KEY_PEM:?JWT_PRIVATE_KEY_PEM must be set}"
      JWT_PUBLIC_KEY_PEM:  "${JWT_PUBLIC_KEY_PEM:?JWT_PUBLIC_KEY_PEM must be set}"

      # Required by main.py's production security gate — missing from the
      # full docker-compose.yml too (pre-existing gap, not introduced here).
      CSRF_SECRET:         "${CSRF_SECRET:?CSRF_SECRET must be set (openssl rand -hex 32)}"
      EDGE_INTERNAL_SECRET: "${EDGE_INTERNAL_SECRET:?EDGE_INTERNAL_SECRET must be set (openssl rand -hex 32)}"

      # Database
      DATABASE_URL:      "postgresql://payshield:${POSTGRES_PASSWORD}@postgres:5432/payshield"
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     "5432"
      POSTGRES_USER:     payshield
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      DB_POOL_SIZE:      "${DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW:   "${DB_MAX_OVERFLOW:-20}"

      # Cache
      REDIS_URL:      "redis://:${REDIS_PASSWORD:-}@redis:6379/0"
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      # Streaming/graph/object-storage/secrets/LLM/mqtt are intentionally
      # absent — none of those services run in this minimal profile, and
      # each integration in the app degrades gracefully (audit gated by
      # ENABLE_KAFKA_AUDIT=false; graph/vault/mqtt/ollama connect lazily and
      # log a warning rather than crash; see docs/03-lua-modules-reference.md
      # equivalent notes in the backend code for each client).
      ENABLE_KAFKA_AUDIT:      "false"
      ENABLE_AUDIT_DB_PERSIST: "true"
      EVIDENCE_STORAGE_REQUIRED: "false"
      EVIDENCE_SIGNING_REQUIRED: "${EVIDENCE_SIGNING_REQUIRED:-true}"
      EVIDENCE_RETENTION_YEARS:  "5"

      # Edge token HMAC — MUST match nginx value exactly
      EDGE_CONTEXT_HMAC_KEY: "${EDGE_CONTEXT_HMAC_KEY:?EDGE_CONTEXT_HMAC_KEY must be set}"

      # Dashboard admin — seeds the first super_admin on first deployment.
      DASHBOARD_SUPER_ADMIN_USERNAME: "${DASHBOARD_SUPER_ADMIN_USERNAME:-super_admin}"
      DASHBOARD_SUPER_ADMIN_PASSWORD: "${DASHBOARD_SUPER_ADMIN_PASSWORD:?DASHBOARD_SUPER_ADMIN_PASSWORD must be set}"
      BANK_BLOCK_WEBHOOK_URL:   "${BANK_BLOCK_WEBHOOK_URL:-}"
      BANK_BLOCK_WEBHOOK_TOKEN: "${BANK_BLOCK_WEBHOOK_TOKEN:-}"

      # Composite Decision Token layer weights (defaults used if absent)
      CDT_WEIGHT_EDGE_TRUST: "${CDT_WEIGHT_EDGE_TRUST:-0.10}"
      CDT_WEIGHT_FRAUD:      "${CDT_WEIGHT_FRAUD:-0.30}"
      CDT_WEIGHT_GRAPH:      "0"
      CDT_WEIGHT_SEMANTIC:   "${CDT_WEIGHT_SEMANTIC:-0.15}"
      CDT_WEIGHT_AI:         "0"
      CDT_WEIGHT_COMPLIANCE: "${CDT_WEIGHT_COMPLIANCE:-0.10}"
      CDT_BLOCK_THRESHOLD:   "${CDT_BLOCK_THRESHOLD:-75}"
      CDT_STEP_UP_THRESHOLD: "${CDT_STEP_UP_THRESHOLD:-50}"
      CDT_REVIEW_THRESHOLD:  "${CDT_REVIEW_THRESHOLD:-30}"

      # Apple iOS attestation
      APPLE_APP_ID:         "${APPLE_APP_ID:-}"
      APPLE_APP_ATTEST_ENV: "${APPLE_APP_ATTEST_ENV:-production}"
      ATTESTATION_BYPASS_ALLOWED: "${ATTESTATION_BYPASS_ALLOWED:-false}"

      DEMO_LOGIN_USERNAME: "${DEMO_LOGIN_USERNAME:-demo_investor}"
      DEMO_LOGIN_PASSWORD: "${DEMO_LOGIN_PASSWORD:-Demo@123}"

      PDF_CERT_PATH:       /app/certs/payshield-pdf-signing.p12
      PDF_CERT_PASSPHRASE: "${PDF_CERT_PASSPHRASE:-}"

      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      PAYSHIELD_MODEL_DIR: /app/models
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://diimeai.com,https://api.diimeai.com}"

    volumes:
      - ../payshield-backend/keys:/app/keys
      - models_data:/app/models
    networks: [payshield-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: "${BACKEND_MEMORY_LIMIT:-512m}"
