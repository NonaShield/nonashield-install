    volumes:
      - ../payshield-backend/keys:/app/keys
      - models_data:/app/models
      # mTLS certs, written by mtls-init into the same SSL_DIR nginx mounts.
      - type: bind
        source: "${SSL_DIR:?SSL_DIR must be set (dir containing fullchain.pem + privkey.pem)}"
        target: /app/ssl
        read_only: true
    networks: [payshield-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mtls-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$BACKEND_TLS_ENABLED\" = \"true\" ]; then curl -sf -k ${HEALTHCHECK_CLIENT_CERT:+--cert \"$HEALTHCHECK_CLIENT_CERT\"} ${HEALTHCHECK_CLIENT_KEY:+--key \"$HEALTHCHECK_CLIENT_KEY\"} \"https://localhost:${UVICORN_TLS_PORT:-8443}/health\"; else curl -sf http://localhost:8000/health; fi"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: "${BACKEND_MEMORY_LIMIT:-512m}"

  # A-6: NGINX→backend mTLS material, generated in place in SSL_DIR (scripts/gen_internal_mtls.py):
  # internal CA, backend server cert, nginx and Prometheus client certs, and the nginx include
  # backend-mtls.conf. Runs once before the backend starts; idempotent, renews leaves with < 30 days.
  # BACKEND_TLS_ENABLED=false removes the include, so nginx and the backend both stay on plain HTTP.
  mtls-init:
    build:
      context: ../payshield-backend
      dockerfile: Dockerfile
      target: production
    image: nonashield/backend:latest
    container_name: payshield-mtls-init
    user: "0:0"
    entrypoint: ["python", "scripts/gen_internal_mtls.py", "/app/ssl"]
    environment:
      BACKEND_TLS_ENABLED: "${BACKEND_TLS_ENABLED:-true}"
    volumes:
      - type: bind
        source: "${SSL_DIR:?SSL_DIR must be set (dir containing fullchain.pem + privkey.pem)}"
        target: /app/ssl
    networks: [payshield-net]
    restart: "no"
    logging: *default-logging
