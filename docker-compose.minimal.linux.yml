# =============================================================================
# NonaShield — Minimal Production Stack (4 services) — generic Linux
#
# Copy of payshield-backend/docker-compose.minimal.yml (untouched, proven,
# committed separately) — nothing below differs by host OS. Deliberately
# leaner than docker-compose.full.linux.yml at the APPLICATION level, not
# just the compose level: ENABLE_KAFKA_AUDIT=false below means the backend
# itself never tries to reach Redpanda, so no redpanda/processor/ingestion
# container is needed at all here.
#
# Scope: device/SDK -> nginx (edge trust verification + RASP/behavior/geo
# ingestion) -> backend (enrollment, threat ingestion, SOC dashboard) ->
# postgres (storage) + redis (pubkey cache, replay/nonce store).
#
# Deliberately excludes: neo4j (graph/fraud-ring analysis), redpanda (Kafka
# audit streaming), minio (evidence object storage), vault (secrets --
# USE_VAULT is already false in app code), grafana/prometheus (metrics),
# airflow (job scheduling), mqtt, ollama (analyst-only LLM features).
# None of those are required for threat ingestion or the SOC dashboard.
#
# Use on any non-Ubuntu Linux distro with Docker Engine + Compose plugin
# installed via your distro's package manager (https://docs.docker.com/engine/install/).
#
# Quick start (run from install/, .env lives in payshield-backend/):
#   cp ../payshield-backend/.env.example ../payshield-backend/.env   # fill in secrets
#   docker compose -f docker-compose.minimal.linux.yml --env-file ../payshield-backend/.env up -d --build
#   docker compose -f docker-compose.minimal.linux.yml --env-file ../payshield-backend/.env down        # keep data
#   docker compose -f docker-compose.minimal.linux.yml --env-file ../payshield-backend/.env down -v     # wipe data
#
# This file additionally requires (not needed by the full stack, since it
# defaults them there): JWT_PRIVATE_KEY_PEM, JWT_PUBLIC_KEY_PEM, CSRF_SECRET,
# EDGE_INTERNAL_SECRET. Generate RSA keys with:
#   openssl genrsa -out jwt_private.pem 2048 && openssl rsa -in jwt_private.pem -pubout -out jwt_public.pem
# and CSRF_SECRET/EDGE_INTERNAL_SECRET with: openssl rand -hex 32
# =============================================================================

networks:
  payshield-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  models_data:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    image: nonashield/nginx-edge:latest
    container_name: payshield-nginx
    environment:
      # APP_ENV added (2026-07): see docker-compose.yml's identical comment --
      # attestation_validator.lua's ATTESTATION_BYPASS_ALLOWED gate now also
      # requires APP_ENV to be a recognised dev/demo name; without it reaching
      # this container the gate always saw the "production" fallback and would
      # silently ignore ATTESTATION_BYPASS_ALLOWED=true.
      APP_ENV:               "${APP_ENV:-production}"
      PAYSHIELD_SERVER_NAME: "${PAYSHIELD_SERVER_NAME:-api.diimeai.com}"
      PAYSHIELD_IPV6: "${PAYSHIELD_IPV6:-false}"
      # The tenant the edge stamps and keys device commands under: this deployment's own tenant.
      PAYSHIELD_TENANT_ID:   "${DEFAULT_TENANT_ID:-default_tenant}"
      EDGE_CONTEXT_HMAC_KEY: "${EDGE_CONTEXT_HMAC_KEY:?EDGE_CONTEXT_HMAC_KEY must be set (openssl rand -hex 32)}"
      # Must equal the backend's EDGE_INTERNAL_SECRET (required below), or every
      # /api/internal/* call is rejected -- nginx would otherwise send the "true" literal.
      EDGE_INTERNAL_SECRET:  "${EDGE_INTERNAL_SECRET:?EDGE_INTERNAL_SECRET must be set (openssl rand -hex 32)}"
      # C-3 rotation: the id stamped in the signed token. Rotate by giving the backend the new key as
      # EDGE_CONTEXT_HMAC_KEY and the old one as EDGE_CONTEXT_HMAC_KEY_PREVIOUS first, then switch nginx.
      EDGE_CONTEXT_HMAC_KEY_ID: "${EDGE_CONTEXT_HMAC_KEY_ID:-}"
      REDIS_HOST:            redis
      REDIS_PORT:            "6379"
      REDIS_PASSWORD:        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      ALLOWED_ORIGINS:       "${CORS_ALLOWED_ORIGINS:-https://diimeai.com,https://api.diimeai.com}"
      POLICY_SYNC_INTERVAL:  "60"
      ATTESTATION_BYPASS_ALLOWED: "${ATTESTATION_BYPASS_ALLOWED:-false}"
    ports:
      - "${HTTPS_PORT:-443}:8443"
      # Port 80 is deliberately NOT published here. nginx's only port-8080 listener
      # (conf.d/grafana_proxy.conf) is a bare HTTP->HTTPS redirect -- not part of the
      # documented architecture (TLS 1.3 only on 8443) -- and an open, unencrypted
      # port is exactly the kind of unexpected attack surface a customer's own
      # security audit flags (RFP Sr 47). If you specifically want the convenience
      # redirect, add back `- "${HTTP_PORT:-80}:8080"` yourself.
    volumes:
      - type: bind
        source: "${SSL_DIR:?SSL_DIR must be set (dir containing fullchain.pem + privkey.pem)}"
        target: /etc/nginx/ssl
        read_only: true
      - type: bind
        source: "${GEOIP_DIR:?GEOIP_DIR must be set (dir containing GeoLite2-*.mmdb files)}"
        target: /usr/share/GeoIP
        read_only: true
      - type: bind
        source: ../payshield-backend/config/threat_matrix.json
        target: /etc/nginx/config/threat_matrix.json
        read_only: true
      - type: bind
        source: ../nginx/lua
        target: /etc/nginx/lua
        read_only: true
      - type: bind
        source: ../nginx/nginx.conf
        target: /etc/nginx/nginx.conf.template
        read_only: true
      - nginx_logs:/var/log/nginx
    networks: [payshield-net]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -k https://localhost:8443/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  postgres:
    image: postgres:15-alpine
    container_name: payshield-postgres
    environment:
      POSTGRES_DB:       payshield
      POSTGRES_USER:     payshield
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../payshield-backend/infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks: [payshield-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payshield -d payshield"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: payshield-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - "${REDIS_PASSWORD:-}"
      - --protected-mode
      - "yes"
      - --tcp-keepalive
      - "60"
    volumes:
      - redis_data:/data
    networks: [payshield-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  backend:
    build:
      context: ../payshield-backend
      dockerfile: Dockerfile
      target: production
    image: nonashield/backend:latest
    container_name: payshield-backend
    environment:
      ENVIRONMENT:     "${ENVIRONMENT:-production}"
      APP_ENV:         "${APP_ENV:-production}"
      LOG_LEVEL:       "${LOG_LEVEL:-info}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-4}"
      UVICORN_HOST:    "0.0.0.0"
      UVICORN_PORT:    "8000"

      # NGINX→backend mTLS (A-6), on by default — see docker-compose.yml's identical section.
      BACKEND_TLS_ENABLED: "${BACKEND_TLS_ENABLED:-true}"
      UVICORN_TLS_PORT:    "${UVICORN_TLS_PORT:-8443}"
      BACKEND_SSL_CERTFILE: "${BACKEND_TLS_ENABLED:+/app/ssl/backend.crt}"
      BACKEND_SSL_KEYFILE:  "${BACKEND_TLS_ENABLED:+/app/ssl/backend.key}"
      BACKEND_SSL_CA_CERTS: "${BACKEND_TLS_ENABLED:+/app/ssl/ca.crt}"
      HEALTHCHECK_CLIENT_CERT: "${BACKEND_TLS_ENABLED:+/app/ssl/nginx-client.crt}"
      HEALTHCHECK_CLIENT_KEY:  "${BACKEND_TLS_ENABLED:+/app/ssl/nginx-client.key}"

      # Secret sourcing (2026-07 fix): see docker-compose.yml's identical
      # comment -- USE_AWS_SM was never listed here, so a non-AWS customer's
      # own .env setting was silently dropped (no env_file: on this service).
      USE_AWS_SM: "${USE_AWS_SM:-true}"

      # API security
      API_SECRET_KEY:                   "${API_SECRET_KEY:?API_SECRET_KEY must be set}"
      JWT_SECRET:                       "${JWT_SECRET:?JWT_SECRET must be set}"
      BACKEND_API_KEY:                  "${BACKEND_API_KEY:?BACKEND_API_KEY must be set}"
      PAYSHIELD_SIGNING_SECRET_DEFAULT: "${PAYSHIELD_SIGNING_SECRET_DEFAULT:?PAYSHIELD_SIGNING_SECRET_DEFAULT must be set}"
      POLICY_SIGNING_SECRET:            "${PAYSHIELD_SIGNING_SECRET_DEFAULT:?PAYSHIELD_SIGNING_SECRET_DEFAULT must be set}"

      # JWT RSA key pair — required in production (checked at import time by
      # jwt_validator.py and again in main.py's startup handler).
      JWT_PRIVATE_KEY_PEM: "${JWT_PRIVATE_KEY_PEM:?JWT_PRIVATE_KEY_PEM must be set}"
      JWT_PUBLIC_KEY_PEM:  "${JWT_PUBLIC_KEY_PEM:?JWT_PUBLIC_KEY_PEM must be set}"

      # Required by main.py's production security gate.
      CSRF_SECRET:         "${CSRF_SECRET:?CSRF_SECRET must be set (openssl rand -hex 32)}"
      EDGE_INTERNAL_SECRET: "${EDGE_INTERNAL_SECRET:?EDGE_INTERNAL_SECRET must be set (openssl rand -hex 32)}"
      # C-3 rotation: the previous key/secret are accepted alongside the current one until nginx has switched.
      EDGE_CONTEXT_HMAC_KEY_ID:          "${EDGE_CONTEXT_HMAC_KEY_ID:-}"
      EDGE_CONTEXT_HMAC_KEY_PREVIOUS:    "${EDGE_CONTEXT_HMAC_KEY_PREVIOUS:-}"
      EDGE_CONTEXT_HMAC_KEY_PREVIOUS_ID: "${EDGE_CONTEXT_HMAC_KEY_PREVIOUS_ID:-}"
      EDGE_INTERNAL_SECRET_PREVIOUS:     "${EDGE_INTERNAL_SECRET_PREVIOUS:-}"

      # Database
      DATABASE_URL:      "postgresql://payshield:${POSTGRES_PASSWORD}@postgres:5432/payshield"
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     "5432"
      POSTGRES_USER:     payshield
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      DB_POOL_SIZE:      "${DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW:   "${DB_MAX_OVERFLOW:-20}"

      # Cache
      REDIS_URL:      "redis://:${REDIS_PASSWORD:-}@redis:6379/0"
      REDIS_HOST:     redis
      REDIS_PORT:     "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      # Streaming/graph/object-storage/secrets/LLM/mqtt are intentionally
      # absent — none of those services run in this minimal profile, and
      # each integration in the app degrades gracefully (audit gated by
      # ENABLE_KAFKA_AUDIT=false; graph/vault/mqtt/ollama connect lazily and
      # log a warning rather than crash; see docs/03-lua-modules-reference.md
      # equivalent notes in the backend code for each client).
      ENABLE_KAFKA_AUDIT:      "false"
      ENABLE_AUDIT_DB_PERSIST: "true"
      EVIDENCE_STORAGE_REQUIRED: "false"
      EVIDENCE_SIGNING_REQUIRED: "${EVIDENCE_SIGNING_REQUIRED:-true}"
      # Regulator SAR export -- blank by default (see .env.example for why).
      RBI_SAR_ENDPOINT:  "${RBI_SAR_ENDPOINT:-}"
      NPCI_SAR_ENDPOINT: "${NPCI_SAR_ENDPOINT:-}"
      EVIDENCE_RETENTION_YEARS:  "5"

      # Edge token HMAC — MUST match nginx value exactly
      EDGE_CONTEXT_HMAC_KEY: "${EDGE_CONTEXT_HMAC_KEY:?EDGE_CONTEXT_HMAC_KEY must be set}"

      # Dashboard admin — seeds the first super_admin on first deployment.
      DASHBOARD_SUPER_ADMIN_USERNAME: "${DASHBOARD_SUPER_ADMIN_USERNAME:-super_admin}"
      DASHBOARD_SUPER_ADMIN_PASSWORD: "${DASHBOARD_SUPER_ADMIN_PASSWORD:?DASHBOARD_SUPER_ADMIN_PASSWORD must be set}"
      BANK_BLOCK_WEBHOOK_URL:   "${BANK_BLOCK_WEBHOOK_URL:-}"
      BANK_BLOCK_WEBHOOK_TOKEN: "${BANK_BLOCK_WEBHOOK_TOKEN:-}"

      # Composite Decision Token layer weights (defaults used if absent)
      CDT_WEIGHT_EDGE_TRUST: "${CDT_WEIGHT_EDGE_TRUST:-0.10}"
      CDT_WEIGHT_FRAUD:      "${CDT_WEIGHT_FRAUD:-0.30}"
      CDT_WEIGHT_GRAPH:      "0"
      CDT_WEIGHT_SEMANTIC:   "${CDT_WEIGHT_SEMANTIC:-0.15}"
      CDT_WEIGHT_AI:         "0"
      CDT_WEIGHT_COMPLIANCE: "${CDT_WEIGHT_COMPLIANCE:-0.10}"
      CDT_BLOCK_THRESHOLD:   "${CDT_BLOCK_THRESHOLD:-75}"
      CDT_STEP_UP_THRESHOLD: "${CDT_STEP_UP_THRESHOLD:-50}"
      CDT_REVIEW_THRESHOLD:  "${CDT_REVIEW_THRESHOLD:-30}"

      # Apple iOS attestation
      APPLE_APP_ID:         "${APPLE_APP_ID:-}"
      APPLE_APP_ATTEST_ENV: "${APPLE_APP_ATTEST_ENV:-production}"
      ATTESTATION_BYPASS_ALLOWED: "${ATTESTATION_BYPASS_ALLOWED:-false}"

      DEMO_LOGIN_USERNAME: "${DEMO_LOGIN_USERNAME:-demo_investor}"
      DEMO_LOGIN_PASSWORD: "${DEMO_LOGIN_PASSWORD:-Demo@123}"

      PDF_CERT_PATH:       /app/certs/payshield-pdf-signing.p12
      PDF_CERT_PASSPHRASE: "${PDF_CERT_PASSPHRASE:-}"

      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      PAYSHIELD_MODEL_DIR: /app/models
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://diimeai.com,https://api.diimeai.com}"

      # CSRF — separate allow-list from CORS above (app/middleware/csrf_middleware.py),
      # checked independently on state-changing requests to session-cookie routes
      # (e.g. the tenant dashboard's /tenant/actions). Same values as CORS by default.
      CSRF_ALLOWED_ORIGINS: "${CSRF_ALLOWED_ORIGINS:-https://diimeai.com,https://api.diimeai.com}"

      # Same class of bug as USE_AWS_SM above: this service has no env_file:,
      # so a var set in the host .env but not listed here never reaches the
      # container -- matches docker-compose.yml's identical section exactly.
      # SAAS_TRIAL_ENABLED defaults to false; on-prem/BYOC installs never set
      # it, so the trial/tenant routers stay unmounted regardless.
      SAAS_TRIAL_ENABLED: "${SAAS_TRIAL_ENABLED:-false}"
      # Web fingerprint SDK routes -- off by default, same mount-or-404 gating
      # as SAAS_TRIAL_ENABLED. This is what makes the minimal tier usable
      # standalone as a web-fingerprint-only deployment (nginx + this backend
      # + postgres + redis, no mobile-SDK-specific services needed): set
      # WEB_SDK_ENABLED=true and supply WEB_SEALING_PRIVATE_KEY_PEM, nothing
      # else in this file changes. The sealing key is a P-256 private key PEM
      # (\n-escaped); unset means telemetry is refused (fail closed).
      WEB_SDK_ENABLED:             "${WEB_SDK_ENABLED:-false}"
      WEB_SEALING_PRIVATE_KEY_PEM: "${WEB_SEALING_PRIVATE_KEY_PEM:-}"
      DEFAULT_TENANT_ID: "${DEFAULT_TENANT_ID:-default_tenant}"

      # >>> generated by tools/gen_env_reference.py: settings the code reads that are not named above; no value = taken from .env or the shell when set >>>
      ACCOUNT_CHANGE_RETENTION_DAYS:
      ADMIN_SILICON_DEV_BYPASS:
      AI_PROJECTOR_ENABLED:
      AI_PROJECTOR_INTERVAL_S:
      ALLOW_DB_KEY_FALLBACK:
